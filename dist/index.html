    <style>
      /* Loader inicial - mostra enquanto React carrega */
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
      }

      #app-loader.dark {
        background: #0a0a0a;
        color: #ffffff;
      }

      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      .dark .loader-spinner {
        border-color: #333;
        border-top-color: #3b82f6;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-text {
        color: #666;
        font-size: 14px;
      }

      .dark .loader-text {
        color: #999;
      }
    </style>

    <script type="module" crossorigin src="./assets/index-_027wctH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CtWmjvJ1.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <!-- Loader inicial -->
    <div id="app-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Carregando Zaty Gráfica...</div>
    </div>

    <div id="root"></div>

    <script>
      // Remove o loader quando o React renderizar
      window.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            const loader = document.getElementById('app-loader');
            if (loader) {
              loader.style.opacity = '0';
              loader.style.transition = 'opacity 0.3s';
              setTimeout(() => loader.remove(), 300);
            }
            observer.disconnect();
          }
        });

        observer.observe(document.getElementById('root'), {
          childList: true,
          subtree: true
        });

        // Fallback: remove loader após 10s mesmo que React não carregue
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader) loader.remove();
        }, 10000);

        // Detectar tema escuro
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.getElementById('app-loader').classList.add('dark');
        }
      });
    </script>
  </body>
